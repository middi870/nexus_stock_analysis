# NEXUS — nginx config
# Serves the React SPA and optionally proxies /api → backend.
# When deploying frontend + backend as separate Railway services,
# set REACT_APP_API_URL at build time instead of using this proxy.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Gzip ─────────────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/javascript image/svg+xml;
    gzip_min_length 1024;
    gzip_proxied any;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"  always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header Referrer-Policy        "no-referrer" always;

    # ── Static assets — long cache ────────────────────────────────────────────
    location ~* \.(js|css|png|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── API proxy (only if BACKEND_URL env is set via nginx envsubst) ─────────
    # Uncomment and configure if serving both from one container:
    # location /api/ {
    #     proxy_pass        http://backend:8000/;
    #     proxy_set_header  Host $host;
    #     proxy_set_header  X-Real-IP $remote_addr;
    #     proxy_buffering   off;                    # needed for SSE
    #     proxy_cache       off;
    #     proxy_read_timeout 300s;
    # }

    # ── Health check endpoint ─────────────────────────────────────────────────
    location = /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # ── SPA fallback — all routes → index.html ────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
